apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-adk-demo-ui
  labels:
    app: google-adk-demo-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: google-adk-demo-ui
  template:
    metadata:
      labels:
        app: google-adk-demo-ui
    spec:
      containers:
        - name: google-adk-demo-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ui.port }}
          {{- if .Values.caBundle.enabled }}
          volumeMounts:
            - name: custom-ca
              mountPath: "/etc/ssl/certs/custom"
              readOnly: true
          {{- end }}
          env:
            - name: BACKEND_URL
              value: {{ .Values.ui.backendUrl | quote }}
            {{- if .Values.caBundle.enabled }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/custom/ca-bundle.crt"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/custom/ca-bundle.crt"
            {{- end }}
      {{- if .Values.caBundle.enabled }}
      volumes:
        - name: custom-ca
          configMap:
            name: apex-ca-bundle
      {{- end }}
