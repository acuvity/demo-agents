apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-file
data:
  config.yaml: |
    model_list:
      - model_name: {{ .Values.litellm.modelName }}
        litellm_params:
          model: {{ .Values.litellm.model }}
          api_key: os.environ/ANTHROPIC_API_KEY
    litellm_settings:
      callbacks: ["otel"]
      forward_client_headers:
        - traceparent
      forward_traceparent_to_llm_provider: true
    general_settings:
      forward_client_headers_to_llm_api: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image }}"
          args:
            - "--config"
            - "/app/proxy_server_config.yaml"
          ports:
            - containerPort: 4500
          volumeMounts:
            - name: config-volume
              mountPath: /app/proxy_server_config.yaml
              subPath: config.yaml
            {{- if .Values.caBundle.enabled }}
            - name: custom-ca
              mountPath: "/etc/ssl/certs/custom"
              readOnly: true
            {{- end }}
          env:
            - name: PORT
              value: "4500"
            {{- if .Values.caBundle.enabled }}
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/custom/ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/custom/ca-bundle.crt"
            {{- end }}
            - name: GOOGLE_ADK_LITELLM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: GOOGLE_ADK_LITELLM_TOKEN
            - name: HTTPS_PROXY
              value: "https://token:$(GOOGLE_ADK_LITELLM_TOKEN)@{{ .Values.proxy.host }}:{{ .Values.proxy.httpsPort }}"
            - name: HTTP_PROXY
              value: "http://token:$(GOOGLE_ADK_LITELLM_TOKEN)@{{ .Values.proxy.host }}:{{ .Values.proxy.httpPort }}"
          envFrom:
            - secretRef:
                name: agent-secrets
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config-file
        {{- if .Values.caBundle.enabled }}
        - name: custom-ca
          configMap:
            name: apex-ca-bundle
        {{- end }}


