# Local multi-container rehearsal (UI + agent + MCP). Not required for Kubernetes.
# From this directory:
#   docker compose --env-file .env up --build
#
# Prerequisites:
#   1. Create deploy/compose/.env with APP_TOKEN, APEX_URL, and LLM key.
#   2. Place the Apex CA cert at deploy/compose/ca.pem.
#
# Agent proxy is built by run.sh/run_ui.sh from APP_TOKEN + APEX_URL
# MCP/UI build their own proxy envs from the same APP_TOKEN + APEX_URL.
# SSL_CERT_FILE and REQUESTS_CA_BUNDLE point to mounted ca.pem for Python services.

services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  webhook-receiver:
    build:
      context: ../../src/agent
      dockerfile: Dockerfile
    command: ["sh", "-c", "exec uv run python3 utils/webhook_receiver.py"]
    environment:
      WEBHOOK_PORT: "9000"
      WEBHOOK_HOST: "0.0.0.0"
    ports:
      - "9000:9000"

  mcp:
    build:
      context: ../../src/agent
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "export HTTPS_PROXY=\"https://ibac-demo~mcp-servers:$${APP_TOKEN}@$${APEX_URL#https://}\"; export HTTP_PROXY=\"https://ibac-demo~mcp:$${APP_TOKEN}@$${APEX_URL#https://}\"; exec uv run python3 tools/mcp_tools.py",
      ]
    depends_on:
      - mailpit
      - webhook-receiver
    environment:
      LOCAL_MCP_TRANSPORT: sse
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
      MAILHOG_HOST: mailpit
      MAILHOG_PORT: "1025"
      WEBHOOK_RECEIVER_URL: http://webhook-receiver:9000
      APP_TOKEN: ${APP_TOKEN}
      APEX_URL: ${APEX_URL}
      SSL_CERT_FILE: /etc/ssl/certs/custom/ca.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/custom/ca.pem
    volumes:
      - ./ca.pem:/etc/ssl/certs/custom/ca.pem:ro
    ports:
      - "18000:8000"

  mcp-tls:
    image: nginx:alpine
    depends_on:
      - mcp
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    tmpfs:
      - /etc/nginx/tls:size=1M
    volumes:
      - ./mcp-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mcp-tls/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ${CA_CERT_PATH:-../../../../certs/ca-cert.pem}:/etc/nginx/ca/ca-cert.pem:ro
      - ${CA_KEY_PATH:-../../../../certs/ca-key.pem}:/etc/nginx/ca/ca-key.pem:ro

  agent:
    build:
      context: ../../src/agent
      dockerfile: Dockerfile
    depends_on:
      - mcp
      - mcp-tls
    env_file:
      - .env
    command: ["bash", "run_ui.sh"]
    environment:
      PORT: "8000"
      MCP_SERVER: local
      LOCAL_MCP_SSE_URL: https://mcp-tls:8443/sse
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      SSL_CERT_FILE: /etc/ssl/certs/custom/ca.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/custom/ca.pem
    volumes:
      - ./ca.pem:/etc/ssl/certs/custom/ca.pem:ro
    ports:
      - "8300:8000"

  ui:
    build:
      context: ../../src/ui
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "export HTTPS_PROXY=\"https://ibac-demo~ui:$${APP_TOKEN}@$${APEX_URL#https://}\"; export HTTP_PROXY=\"https://ibac-demo~ui:$${APP_TOKEN}@$${APEX_URL#https://}\"; exec npm run dev -- --host 0.0.0.0",
      ]
    depends_on:
      - agent
    environment:
      BACKEND_URL: "http://agent:8000"
      APP_TOKEN: ${APP_TOKEN}
      APEX_URL: ${APEX_URL}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/custom/ca.pem
    volumes:
      - ./ca.pem:/etc/ssl/certs/custom/ca.pem:ro
    ports:
      - "5174:5174"

  cloud-apex:
    image: acuvity/cloud-apex:stable
    user: "1001:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:8443"
    extra_hosts:
      - "api.local.acuvity.ai:host-gateway"
      - "api-acumux:192.168.5.2"
    environment:
      APEX_LOG_LEVEL: debug
      APEX_LOG_FORMAT: json
      APEX_ANALYZER_URL: ""
      APEX_AGENT_ENABLED: "true"
      APEX_SINGLE_USER_MODE: "false"
      APEX_AGENT_STANDALONE_LISTENER_ADDR: ":8443"
      APEX_AGENT_DISABLE_DNS_MONITOR: "true"
      APEX_AGENT_ENABLE_POD_INFO: "false"
      APEX_AGENT_ENABLE_PLM_MONITOR: "false"
      APEX_AGENT_ENABLE_REDIRECTOR: "false"
      APEX_AGENT_ENABLE_CA_CERT_INJECTION: "false"
      APEX_DYNAMIC_TLS_CA: /etc/acuvity/cloud-apex/dynamic-tls-ca/ca-cert.pem
      APEX_DYNAMIC_TLS_CA_KEY: /etc/acuvity/cloud-apex/dynamic-tls-ca/ca-key.pem
      APEX_HEALTH_ENABLED: "true"
      APEX_HEALTH_LISTEN: ":9080"
      APEX_API_TOKEN: ${APEX_API_TOKEN}
      APEX_UPSTREAM_ADDITIONAL_CA: /etc/acuvity/cloud-apex/dynamic-tls-ca/ca-cert.pem
      APEX_ACUTRACER_ENABLE: "true"
      APEX_ACUTRACER_TRACESTATE_PASSPHRASE: "passphrase"
    volumes:
      - ${CA_CERT_PATH:-../../../../certs/ca-cert.pem}:/etc/acuvity/cloud-apex/dynamic-tls-ca/ca-cert.pem:ro
      - ${CA_KEY_PATH:-../../../../certs/ca-key.pem}:/etc/acuvity/cloud-apex/dynamic-tls-ca/ca-key.pem:ro
