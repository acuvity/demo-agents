{{- if .Values.webhookReceiver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.webhookReceiver.deploymentName }}
  labels:
    app: {{ .Values.webhookReceiver.deploymentName }}
    type: webhook-receiver
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.webhookReceiver.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.webhookReceiver.deploymentName }}
    type: webhook-receiver
{{- end }}
