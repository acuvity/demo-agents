apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-pricing-agent
  labels:
    app: a2a-pricing-agent
spec:
  replicas: {{ .Values.pricingAgent.replicas }}
  selector:
    matchLabels:
      app: a2a-pricing-agent
  template:
    metadata:
      labels:
        app: a2a-pricing-agent
    spec:
      containers:
        - name: pricing-agent
          image: "{{ .Values.pricingAgent.image.repository }}:{{ .Values.pricingAgent.image.tag }}"
          imagePullPolicy: {{ .Values.pricingAgent.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.pricingAgent.port }}
          envFrom:
            - secretRef:
                name: a2a-secrets
          volumeMounts:
            - name: a2a-config
              mountPath: "/app/config.yaml"
              subPath: config.yaml
              readOnly: true
            - name: custom-ca
              mountPath: "/etc/ssl/certs/custom"
              readOnly: true
          env:
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/custom/ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/custom/ca-bundle.crt"
      volumes:
        - name: a2a-config
          secret:
            secretName: a2a-secrets
            items:
              - key: config.yaml
                path: config.yaml
        - name: custom-ca
          configMap:
            name: apex-ca-bundle
---
