apiVersion: v1
kind: Secret
metadata:
  name: a2a-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ required "secrets.anthropicApiKey is required" .Values.secrets.anthropicApiKey | quote }}
  config.yaml: |
    gateway:
      url: {{ .Values.gateway.url | default "" | quote }}
    ca_cert_path: "/etc/ssl/certs/custom/ca-bundle.crt"
    litellm:
      api_base: {{ .Values.litellm.apiBase | quote }}
    agents:
      travel_planner:
        port: {{ .Values.travelPlanner.port }}
        agent_url: "http://a2a-travel-planner-svc.{{ .Release.Namespace }}.svc.cluster.local"
        flights_agent_url: "http://a2a-flights-agent-svc.{{ .Release.Namespace }}.svc.cluster.local"
        hotels_agent_url: "http://a2a-hotels-agent-svc.{{ .Release.Namespace }}.svc.cluster.local"
        flights_agent_gateway_path: "/a2a-flight-agent"
        hotels_agent_gateway_path: "/a2a-hotel-agent"
        agent_token: {{ .Values.secrets.travelPlannerToken | default "" | quote }}
      flights_agent:
        port: {{ .Values.flightsAgent.port }}
        agent_url: "http://a2a-flights-agent-svc.{{ .Release.Namespace }}.svc.cluster.local"
        pricing_agent_url: "http://a2a-pricing-agent-svc.{{ .Release.Namespace }}.svc.cluster.local"
        pricing_agent_gateway_path: "/a2a-pricing-agent"
        agent_token: {{ .Values.secrets.flightsAgentToken | default "" | quote }}
      hotels_agent:
        port: {{ .Values.hotelsAgent.port }}
        agent_url: "http://a2a-hotels-agent-svc.{{ .Release.Namespace }}.svc.cluster.local"
        agent_token: {{ .Values.secrets.hotelsAgentToken | default "" | quote }}
      pricing_agent:
        port: {{ .Values.pricingAgent.port }}
        agent_url: "http://a2a-pricing-agent-svc.{{ .Release.Namespace }}.svc.cluster.local"
        agent_token: {{ .Values.secrets.pricingAgentToken | default "" | quote }}
