[project]
name = "multi-agent"
version = "0.1.0"
description = "Travel planner multi-agent system using Google ADK + A2A"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a]==2.13.0",
    "uvicorn==0.54.0",
    "python-dotenv>=1.0.0",
    "google-adk[extensions]",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-aiohttp-client==0.65b0",
    "opentelemetry-instrumentation-starlette==0.65b0",
    "opentelemetry-instrumentation-threading==0.65b0",
    "openinference-instrumentation-litellm==0.1.52",
    "openinference-instrumentation-google-adk==1.0.5",
    "litellm==1.106.2",
    "mcp[cli]==2.3.0",
]
