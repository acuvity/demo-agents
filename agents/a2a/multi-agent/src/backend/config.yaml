# Gateway URL for routing agent-to-agent A2A traffic (e.g. through Acuvity).
# Leave empty to call sub-agents directly via their agent_url.
gateway:
  url: ""

ca_cert_path: ""

otel:
  enabled: true
  otlp_endpoint: "http://127.0.0.1:14317"
  insecure: true

litellm:
  api_base: ""

agents:
  travel_planner:
    port: 41241
    # URL advertised in this agent's own card (supported_interfaces)
    agent_url: "http://127.0.0.1:41241"
    # Direct URLs to reach each sub-agent (used when gateway.url is empty)
    flights_agent_url: "http://127.0.0.1:41242"
    hotels_agent_url: "http://127.0.0.1:41243"
    # Path segments used to reach each sub-agent via the gateway
    flights_agent_gateway_path: "/a2a-flight-agent"
    hotels_agent_gateway_path: "/a2a-hotel-agent"
    agent_token: ""
  flights_agent:
    port: 41242
    agent_url: "http://127.0.0.1:41242"
    pricing_agent_url: "http://127.0.0.1:41244"
    pricing_agent_gateway_path: "/a2a-pricing-agent"
    agent_token: ""
  hotels_agent:
    port: 41243
    agent_url: "http://127.0.0.1:41243"
    agent_token: ""
  pricing_agent:
    port: 41244
    agent_url: "http://127.0.0.1:41244"
    agent_token: ""
